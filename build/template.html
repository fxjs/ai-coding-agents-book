<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Coding Agent 实战：Pi、Claude Code 与 Codex</title>
<meta name="description" content="面向软件开发者的 AI Coding Agent 实战指南，覆盖安装、交互、自动化、上下文工程、扩展、多 agent 与内部原理。">
<style>{{CSS}}</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <header class="sidebar-head">
      <div class="brand">AI Coding Agent 实战</div>
      <div class="brand-sub">Pi · Claude Code · Codex</div>
      <div class="meta">{{CHAPTERS}} 篇 · {{WORDS}} 字 · {{DATE}}</div>
      <input id="search" class="search" type="search" placeholder="搜索全文：标题 / 正文 / 代码…" autocomplete="off"
             role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list">
    </header>
    <div class="search-results" id="search-results" role="listbox" aria-label="搜索结果" hidden></div>
    <nav>
      <ul class="toc">
{{TOC}}
      </ul>
    </nav>
    <footer class="sidebar-foot">
      <span class="kbd">/</span> 或 <span class="kbd">⌘K</span> 搜索 · <span class="kbd">Esc</span> 清空
    </footer>
  </aside>

  <main class="content" id="content">
    <div class="topbar">
      <button id="menu" class="menu-btn" aria-label="目录">☰</button>
      <div class="crumb" id="crumb">正文</div>
      <div class="progress"><div id="bar"></div></div>
    </div>
    <article>
{{CONTENT}}
    </article>
    <footer class="page-foot">
      本书示例代码位于 <code>examples/</code>，命令对照见附录 A。版本基准见首页。
    </footer>
  </main>
</div>

<script type="module">
  const nodes = [...document.querySelectorAll('.mermaid')];
  let rendered = false;
  try {
    const mermaid = (await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs')).default;
    const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    mermaid.initialize({
      startOnLoad: false,
      theme: dark ? 'dark' : 'neutral',
      securityLevel: 'loose',
      themeVariables: { background: 'transparent' },
    });
    await mermaid.run({ nodes });
    rendered = true;
    nodes.forEach((n) => n.setAttribute('data-rendered', '1'));
  } catch (err) {
    console.warn('Mermaid 未渲染：', err);
  }
  // 深链接：Mermaid 渲染会改变布局高度，渲染完成后重新对齐锚点
  if (location.hash) {
    const target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (target) requestAnimationFrame(() => target.scrollIntoView({ block: 'start' }));
  }

  if (!rendered || nodes.some((n) => !n.querySelector('svg'))) {
    nodes.forEach((n) => {
      if (!n.querySelector('svg')) n.classList.add('mermaid-fallback');
    });
  }
</script>

<script>
  // ---------------- 全文检索 ----------------
  // 索引在页面加载后从 DOM 构建：零额外网络请求、离线可用、永远与正文同步。
  const search = document.getElementById('search');
  const results = document.getElementById('search-results');
  const sidebar = document.getElementById('sidebar');
  let INDEX = [];
  let hits = [];
  let cursor = -1;
  let timer = 0;
  let currentQuery = '';

  const escapeHtml = (s) =>
    s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const escapeRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

  function buildIndex() {
    const blocks = document.querySelectorAll(
      'article section h1, article section h2, article section h3, article section p, article section li, article section pre, article section td',
    );
    let chapter = '';
    let section = '';
    INDEX = [];
    for (const el of blocks) {
      // 只索引最内层块，避免父子重复计分
      if (el.querySelector('h1,h2,h3,p,li,pre,td')) continue;
      const raw = (el.innerText || '').replace(/\s+/g, ' ').trim();
      if (raw.length < 2) continue;
      if (el.tagName === 'H1') { chapter = raw; section = ''; }
      if (el.tagName === 'H2') section = raw;
      INDEX.push({
        el,
        raw,
        lower: raw.toLowerCase(),
        chapter,
        section,
        kind: el.tagName,
      });
    }
    // 标题后面往往紧跟一段定义，用它给标题命中补上下文
    for (let i = 0; i < INDEX.length; i++) {
      if (!INDEX[i].kind.startsWith('H')) continue;
      const next = INDEX.slice(i + 1, i + 6).find(
        (e) => !e.kind.startsWith('H') && e.raw.length >= 36 && !/[：:]$/.test(e.raw),
      );
      if (next) INDEX[i].preview = next.raw.slice(0, 120);
    }
  }

  const KIND_RANK = { H1: 0, H2: 1, H3: 2, LI: 3, TD: 3, P: 4, PRE: 5 };

  function runSearch(query) {
    const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
    if (!terms.length) return [];
    const found = [];
    for (let i = 0; i < INDEX.length; i++) {
      const e = INDEX[i];
      let first = -1;
      let ok = true;
      for (const t of terms) {
        const at = e.lower.indexOf(t);
        if (at < 0) { ok = false; break; }
        if (first < 0 || at < first) first = at;
      }
      if (!ok) continue;
      // 标题优先，其次正文/代码；同类按出现位置
      found.push({ ...e, idx: i, first, score: (KIND_RANK[e.kind] ?? 6) * 1e6 + first });
    }
    found.sort((a, b) => a.score - b.score);
    return found.slice(0, 40);
  }

  function snippet(text, first, terms) {
    const pad = 34;
    let start = Math.max(0, first - pad);
    let end = Math.min(text.length, first + 110);
    if (start > 0) start = text.indexOf(' ', start) + 1 || start;
    if (end < text.length) end = text.lastIndexOf(' ', end) < start ? end : text.lastIndexOf(' ', end);
    const piece = (start > 0 ? '… ' : '') + text.slice(start, end) + (end < text.length ? ' …' : '');
    const re = new RegExp('(' + terms.map(escapeRe).join('|') + ')', 'gi');
    let out = '';
    let last = 0;
    let m;
    while ((m = re.exec(piece))) {
      out += escapeHtml(piece.slice(last, m.index)) + '<mark>' + escapeHtml(m[0]) + '</mark>';
      last = m.index + m[0].length;
      if (m.index === re.lastIndex) re.lastIndex++;
    }
    return out + escapeHtml(piece.slice(last));
  }

  function renderHits(query) {
    currentQuery = query;
    const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
    hits = query.trim().length >= 1 ? runSearch(query) : [];
    cursor = -1;
    const show = Boolean(query.trim());
    sidebar.classList.toggle('searching', show);
    results.hidden = !show;
    search.setAttribute('aria-expanded', String(show));
    if (!show) { results.innerHTML = ''; return; }

    if (!hits.length) {
      clearOccurrences();
      results.innerHTML = `<div class="search-status">没有匹配「${escapeHtml(query)}」</div>
        <div class="search-empty">试试更短的关键词、英文命令名（如 <code>--tools</code>），或换个说法。</div>`;
      return;
    }

    const list = hits.map((h, i) => {
      const crumb = [h.chapter, h.section].filter(Boolean).join(' · ');
      const kind = h.kind === 'PRE' ? '代码' : h.kind.startsWith('H') ? '标题' : '正文';
      const body = h.kind.startsWith('H') && h.preview
        ? `${snippet(h.raw, h.first, terms)}<span class="hit-preview">${snippet(h.preview, 0, terms)}</span>`
        : snippet(h.raw, h.first, terms);
      return `<button class="hit" type="button" role="option" data-i="${i}" data-kind="${h.kind}">
        <span class="hit-crumb">${escapeHtml(crumb || '正文')}<span class="hit-kind">${kind}</span></span>
        <span class="hit-text">${body}</span>
      </button>`;
    }).join('');

    results.innerHTML = `<div class="search-status">
      <span>${hits.length}${hits.length === 40 ? '+' : ''} 条结果</span>
      <span class="occ-nav" hidden>
        <button type="button" class="occ-prev" title="上一处（Shift+F3）">‹</button>
        <span class="occ-count">0/0</span>
        <button type="button" class="occ-next" title="下一处（F3）">›</button>
      </span>
      <span class="search-hint">↑↓ 选择 · Enter 跳转 · Esc 清除</span>
      <button type="button" class="search-clear" title="清空搜索（Esc）">×</button>
    </div>${list}`;
    results.querySelector('.search-clear').addEventListener('click', resetSearch);
    results.querySelector('.occ-prev').addEventListener('click', () => focusOccurrence(occIndex - 1));
    results.querySelector('.occ-next').addEventListener('click', () => focusOccurrence(occIndex + 1));

    results.querySelectorAll('.hit').forEach((btn) => {
      btn.addEventListener('click', () => jump(Number(btn.dataset.i)));
    });

    buildOccurrences(terms);
    updateOccUI();
  }

  // ---------------- 正文内全部命中高亮（CSS Custom Highlight API） ----------------
  const supportsHighlight =
    typeof CSS !== 'undefined' && !!CSS.highlights && typeof Highlight !== 'undefined';
  let occRanges = [];
  let occIndex = -1;

  function clearOccurrences() {
    occRanges = [];
    occIndex = -1;
    if (supportsHighlight) {
      CSS.highlights.delete('search-hit');
      CSS.highlights.delete('search-current');
    }
    updateOccUI();
  }

  function buildOccurrences(terms) {
    clearOccurrences();
    if (!supportsHighlight || !terms.length) return;
    const root = document.querySelector('article');
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(node) {
        const p = node.parentElement;
        if (!p || p.closest('.mermaid, script, style')) return NodeFilter.FILTER_REJECT;
        return node.nodeValue.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      },
    });
    const re = new RegExp('(' + terms.map(escapeRe).join('|') + ')', 'gi');
    const CAP = 600;
    const seen = new Set();
    let node;
    outer: while ((node = walker.nextNode())) {
      const text = node.nodeValue;
      re.lastIndex = 0;
      let m;
      while ((m = re.exec(text))) {
        const key = `${node.__occKey ??= Math.random()}:${m.index}`;
        if (!seen.has(key)) {
          seen.add(key);
          const range = new Range();
          range.setStart(node, m.index);
          range.setEnd(node, m.index + m[0].length);
          occRanges.push(range);
        }
        if (occRanges.length >= CAP) break outer;
        if (m.index === re.lastIndex) re.lastIndex++;
      }
    }
    if (occRanges.length) CSS.highlights.set('search-hit', new Highlight(...occRanges));
  }

  function focusOccurrence(i, smooth = true) {
    if (!occRanges.length) return;
    occIndex = (i + occRanges.length) % occRanges.length;
    if (supportsHighlight) {
      CSS.highlights.set('search-current', new Highlight(occRanges[occIndex]));
    }
    const host = occRanges[occIndex].startContainer.parentElement;
    host?.scrollIntoView({ block: 'center', behavior: smooth ? 'smooth' : 'auto' });
    updateOccUI();
  }

  function updateOccUI() {
    const nav = results.querySelector('.occ-nav');
    if (!nav) return;
    nav.hidden = occRanges.length === 0;
    const label = results.querySelector('.occ-count');
    if (label) label.textContent = `${occIndex < 0 ? 0 : occIndex + 1}/${occRanges.length}`;
    results.querySelectorAll('.hit').forEach((b, k) => {
      if (k === cursor) b.classList.add('active');
    });
  }

  function jump(i) {
    const hit = hits[i];
    if (!hit) return;
    hit.el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    hit.el.classList.remove('flash');
    void hit.el.offsetWidth;
    hit.el.classList.add('flash');
    setTimeout(() => hit.el.classList.remove('flash'), 2200);
    // 让「当前命中」落在这一条结果内（没有则取其后第一处）
    if (occRanges.length) {
      const inside = occRanges.findIndex((r) => hit.el.contains(r.startContainer));
      if (inside >= 0) focusOccurrence(inside, false);
      else {
        const top = hit.el.getBoundingClientRect().top;
        const after = occRanges.findIndex(
          (r) => (r.startContainer.parentElement?.getBoundingClientRect().top ?? 0) >= top,
        );
        focusOccurrence(after >= 0 ? after : 0, false);
      }
    }

    // 记住位置（file:// 的 origin 为 null，replaceState 可能抛错，忽略即可）
    try {
      if (hit.el.id) history.replaceState(null, '', '#' + hit.el.id);
    } catch {}
    if (currentQuery) {
      try { history.replaceState(null, '', '?q=' + encodeURIComponent(currentQuery) + (hit.el.id ? '#' + hit.el.id : '')); } catch {}
    }
  }

  function moveCursor(delta) {
    if (!hits.length) return;
    cursor = (cursor + delta + hits.length) % hits.length;
    results.querySelectorAll('.hit').forEach((b, i) => {
      b.classList.toggle('active', i === cursor);
      b.setAttribute('aria-selected', String(i === cursor));
    });
    const active = results.querySelector('.hit.active');
    if (active) active.scrollIntoView({ block: 'nearest' });
  }

  function resetSearch() {
    search.value = '';
    renderHits('');
    clearOccurrences();
    search.blur();
  }

  search.addEventListener('input', () => {
    clearTimeout(timer);
    const q = search.value;
    timer = setTimeout(() => renderHits(q), 90);
  });

  search.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); moveCursor(1); results.querySelector('.hit')?.focus({ preventScroll: true }); }
    if (e.key === 'Enter' && hits.length) { e.preventDefault(); jump(cursor < 0 ? 0 : cursor); }
    if (e.key === 'Escape') { e.preventDefault(); resetSearch(); }
  });

  results.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); moveCursor(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveCursor(-1); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      if (cursor < 0) cursor = 0;
      jump(cursor);
      results.querySelector('.hit.active')?.focus({ preventScroll: true });
    } else if (e.key === 'Escape') { e.preventDefault(); resetSearch(); }
  });

  document.addEventListener('keydown', (e) => {
    const target = e.target instanceof Element ? e.target : null;
    const typing = target?.closest('input, textarea, [contenteditable]');
    if ((e.key === '/' && !typing) || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k')) {
      e.preventDefault(); search.focus(); search.select();
    }
    if (e.key === 'Escape' && document.activeElement === search) resetSearch();
    if (e.key === 'F3' && occRanges.length) {
      e.preventDefault();
      focusOccurrence(occIndex + (e.shiftKey ? -1 : 1));
    }
  });

  buildIndex();

  // 支持 ?q=关键词 直接带查询打开（便于分享定位）
  const initial = new URLSearchParams(location.search).get('q');
  if (initial) {
    search.value = initial;
    renderHits(initial);
  }

  // 阅读进度
  const bar = document.getElementById('bar');
  addEventListener('scroll', () => {
    const h = document.documentElement;
    bar.style.width = (h.scrollTop / (h.scrollHeight - h.clientHeight) * 100) + '%';
  }, { passive: true });

  // 手机端目录
  document.getElementById('menu').addEventListener('click', () => document.body.classList.toggle('nav-open'));
  document.querySelectorAll('.toc a').forEach((a) => a.addEventListener('click', () => document.body.classList.remove('nav-open')));

  // 当前小节高亮（按滚动位置取最后一个越过顶部的标题）
  const links = [...document.querySelectorAll('.toc a')];
  const map = new Map(links.map((a) => [a.getAttribute('href').slice(1), a]));
  const crumb = document.getElementById('crumb');
  const heads = [...document.querySelectorAll('article h1, article h2')];
  const nav = document.querySelector('.sidebar');
  let ticking = false;

  function syncActive() {
    ticking = false;
    const y = window.scrollY + Math.min(280, window.innerHeight * 0.35);
    let current = heads[0];
    for (const h of heads) {
      if (h.offsetTop <= y) current = h;
      else break;
    }
    if (!current) return;
    const a = map.get(current.id);
    if (!a) return;
    if (a.classList.contains('active')) return;
    links.forEach((l) => l.classList.remove('active'));
    a.classList.add('active');
    crumb.textContent = a.textContent;

    // 只滚动侧栏本身，绝不干扰正文滚动
    const r = a.getBoundingClientRect();
    const nr = nav.getBoundingClientRect();
    if (r.top < nr.top + 90 || r.bottom > nr.bottom - 40) {
      nav.scrollTop += r.top - nr.top - nr.height / 3;
    }
  }

  addEventListener('scroll', () => {
    if (!ticking) { ticking = true; requestAnimationFrame(syncActive); }
  }, { passive: true });
  syncActive();
</script>
</body>
</html>
